<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LanePets | Acesso Administrativo</title>
  <link rel="stylesheet" href="auth.css?v=4">
</head>
<body class="lp-auth lp-auth--admin">
  <div class="lp-shell">

    <a class="lp-brand" href="cliente.html">
      <span class="lp-brand__marca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="7" cy="8" r="2"/><circle cx="12" cy="5.5" r="2"/><circle cx="17" cy="8" r="2"/>
          <path d="M12 13c-3.3 0-6 2.1-6 4.7 0 1.6 1.5 2.3 3 1.8.9-.3 1.9-.5 3-.5s2.1.2 3 .5c1.5.5 3-.2 3-1.8 0-2.6-2.7-4.7-6-4.7Z"/>
        </svg>
      </span>
      <span>
        <span class="lp-brand__nome">Lane<i>Pets</i></span>
        <span class="lp-brand__sub">Franco + Caieiras</span>
      </span>
    </a>

    <main class="lp-card" id="cartao">
      <span class="lp-badge lp-badge--admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Área restrita
      </span>

      <h1>Acesso Administrativo</h1>
      <p class="lp-card__sub">Entre com suas credenciais para abrir o painel de gestão do LanePets.</p>

      <p class="lp-alert lp-alert--erro" id="aviso" role="alert" aria-live="assertive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2h.01"/></svg>
        <span></span>
      </p>

      <form id="form-login" novalidate>
        <div class="lp-field">
          <div class="lp-field__topo"><label for="email">E-mail</label></div>
          <div class="lp-input">
            <svg class="lp-input__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
            <input id="email" type="email" autocomplete="username" placeholder="admin@gmail.com" required>
            <svg class="lp-input__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
          </div>
          <span class="lp-field__msg"></span>
        </div>

        <div class="lp-field">
          <div class="lp-field__topo"><label for="senha">Senha administrativa</label></div>
          <div class="lp-input">
            <svg class="lp-input__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••" required>
            <button class="lp-input__acao" type="button" data-alvo="#senha" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="lp-olho-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
              <svg class="lp-olho-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.6 9.6 0 0 1 12 6c6.2 0 10 6 10 6a17 17 0 0 1-3.3 3.9"/><path d="M6.3 8.1C3.6 9.8 2 12 2 12s3.8 6.5 10 6.5c1.4 0 2.7-.3 3.8-.8"/><path d="M9.6 9.8a2.6 2.6 0 0 0 3.6 3.6"/></svg>
            </button>
          </div>
          <span class="lp-field__msg"></span>
        </div>

        <button class="lp-btn lp-btn--primario" type="submit" id="entrar">
          <span class="lp-spin" aria-hidden="true"></span>
          <span class="lp-btn__texto">Entrar no painel</span>
        </button>
      </form>

      <p class="lp-dica">Credenciais de teste — <b>admin@gmail.com</b> · senha <b>123456</b></p>
    </main>

    <a class="lp-voltar" href="cliente.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
      Voltar para o LanePets
    </a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/http.js"></script>
  <script src="js/auth-ui.js?v=3"></script>
  <script>
  (function () {
    const UI = window.LanePetsAuthUI;
    const $ = s => document.querySelector(s);
    /* Ordem de preferencia das telas do painel. A primeira que o usuario
       puder ver vira o destino do login. Se ele tiver "retorno" na URL (veio
       de uma pagina protegida) e puder abri-la, o retorno ganha. */
    const DESTINOS = [
      ['dashboard', 'dashboard_financeiro.html'],
      ['agendamentos', 'agendamentos.html'],
      ['pedidos', 'pedidos.html'],
      ['clientes', 'clientes.html'],
      ['pets', 'index.html'],
      ['produtos', 'Produtos.html'],
      ['pagamentos', 'entradas_e_saidas.html'],
      ['relatorios', 'relatorio.html'],
      ['seguros', 'gestao-publica.html'],
      ['avaliacoes', 'gestao-publica.html'],
      ['usuarios', 'usuarios-admin.html'],
      ['configuracoes', 'migrar-dados.html']
    ];

    function primeiraPaginaPermitida(permissoes) {
      if (!permissoes) return 'index.html';
      const pode = chave => permissoes.acessoIrrestrito ||
        (permissoes.modulos && permissoes.modulos[chave] && permissoes.modulos[chave].visualizar);

      const retorno = new URLSearchParams(location.search).get('retorno');
      if (retorno) {
        const alvo = DESTINOS.find(([, pagina]) => '/' + pagina.toLowerCase() === retorno.toLowerCase());
        if (alvo && pode(alvo[0])) return retorno;
      }

      const encontrado = DESTINOS.find(([chave]) => pode(chave));
      /* Sem NENHUM modulo liberado o usuario ainda entra no sistema, mas a
         unica coisa que ele ve e o aviso explicando que falta liberacao. */
      return encontrado ? encontrado[1] : 'acesso-negado.html';
    }

    const form = $('#form-login'), botao = $('#entrar');
    const email = $('#email'), senha = $('#senha');

    UI.ligarOlhos(form);
    UI.ligarCampos(form);
    UI.validarNoBlur(email, v => UI.EMAIL_RE.test(v));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      UI.limpar(form);
      UI.alerta('#aviso', '');

      const valEmail = email.value.trim();
      let valido = true;
      if (!valEmail) valido = UI.erro(email, 'Informe o e-mail administrativo.');
      else if (!UI.EMAIL_RE.test(valEmail)) valido = UI.erro(email, 'Digite um e-mail válido.');
      if (!senha.value) valido = UI.erro(senha, 'Informe a senha administrativa.');
      if (!valido) { UI.alerta('#aviso', 'Revise os campos destacados para continuar.'); return; }

      UI.carregando(botao, true, 'Entrando…');
      try {
        const data = await LanePetsHttp.request('login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: valEmail, senha: senha.value })
        });
        sessionStorage.setItem('lanePetsAuthToken', data.token);
        /* O administrador vai direto para o painel — nunca para a área do cliente.
           PARA QUAL pagina do painel depende do que ele pode ver: mandar todo
           mundo para index.html jogaria um usuario que so tem Produtos direto
           na tela de "acesso negado" no primeiro login. */
        UI.carregando(botao, true, 'Acesso liberado…');
        location.href = primeiraPaginaPermitida(data.permissoes);
      } catch (erro) {
        UI.carregando(botao, false);
        UI.alerta('#aviso', erro.message || 'Não foi possível entrar. Tente novamente.');
        UI.erro(senha, 'Verifique a senha e tente de novo.');
        senha.value = '';
        senha.focus();
      }
    });

    email.focus();
  })();
  </script>
</body>
</html>
