# LanePets — build e testes automatizados (item 12 do roadmap, 26/09).
#
# Substitui o modelo de app WPF que estava aqui (dotnet 8, placeholders e
# assinatura .pfx), que falhava a cada push.
#
# O que roda:
#   1. build da aplicacao (LanePets.csproj, na raiz);
#   2. dotnet test do projeto tests/LanePets.Tests (xUnit + WebApplicationFactory),
#      que sobe a API em memoria contra um banco SQLite temporario.
#
# O mesmo comando na maquina local (de dentro da pasta LanePetsCSharp):
#   dotnet test tests/LanePets.Tests

name: LanePets CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/LanePets.Tests/LanePets.Tests.csproj

      - name: Build
        run: dotnet build tests/LanePets.Tests/LanePets.Tests.csproj --no-restore --configuration Release

      - name: Testes
        run: >
          dotnet test tests/LanePets.Tests/LanePets.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=resultado.trx"
          --results-directory TestResults

      - name: Guardar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-testes
          path: TestResults
