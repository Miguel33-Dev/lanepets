<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Arquitetura do LanePets" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#07562e"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97d12"/></marker>
    <style>
      .t{font-family:'DM Sans','Segoe UI',Arial,sans-serif}
      .h{font-family:Fraunces,Georgia,serif;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#fbfcf4"/>
  <!-- colunas -->
  <rect x="24" y="24" width="250" height="512" rx="18" fill="#ffffff" stroke="#e2eadd"/>
  <rect x="298" y="24" width="590" height="512" rx="18" fill="#f3f7ef" stroke="#cdd9c7"/>
  <rect x="912" y="24" width="264" height="512" rx="18" fill="#ffffff" stroke="#e2eadd"/>
  <text x="149" y="60" text-anchor="middle" class="h" font-size="20" fill="#033c22">Navegador</text>
  <text x="593" y="60" text-anchor="middle" class="h" font-size="20" fill="#033c22">ASP.NET Core · .NET 10</text>
  <text x="1044" y="60" text-anchor="middle" class="h" font-size="20" fill="#033c22">Dados e serviços</text>
  <text x="149" y="80" text-anchor="middle" class="t" font-size="12" fill="#6c7d71">HTML + CSS + JS puro (wwwroot)</text>
  <text x="593" y="80" text-anchor="middle" class="t" font-size="12" fill="#6c7d71">uma aplicação: front + API + tempo real</text>
  <text x="1044" y="80" text-anchor="middle" class="t" font-size="12" fill="#6c7d71">fora da pasta do código</text>

  <!-- navegador -->
  <g class="t">
    <rect x="48" y="110" width="202" height="86" rx="14" fill="#07562e"/>
    <text x="149" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Site público</text>
    <text x="149" y="170" text-anchor="middle" font-size="12" fill="#dcefb9">cliente.html · publico.js</text>
    <rect x="48" y="226" width="202" height="86" rx="14" fill="#07562e"/>
    <text x="149" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Área do cliente</text>
    <text x="149" y="286" text-anchor="middle" font-size="12" fill="#dcefb9">minha-conta.html · sessão do cliente</text>
    <rect x="48" y="342" width="202" height="86" rx="14" fill="#07562e"/>
    <text x="149" y="378" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Painel</text>
    <text x="149" y="402" text-anchor="middle" font-size="12" fill="#dcefb9">18 telas · cookie + ?token=</text>
  </g>

  <!-- app -->
  <g class="t">
    <rect x="322" y="110" width="170" height="318" rx="14" fill="#ffffff" stroke="#07562e" stroke-width="1.5"/>
    <text x="407" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#033c22">Middlewares</text>
    <text x="407" y="176" text-anchor="middle" font-size="12.5" fill="#46584c">Forwarded headers</text>
    <text x="407" y="202" text-anchor="middle" font-size="12.5" fill="#46584c">ErroGlobal</text>
    <text x="407" y="228" text-anchor="middle" font-size="12.5" fill="#46584c">StatusCodePages</text>
    <text x="407" y="254" text-anchor="middle" font-size="12.5" fill="#46584c">CORS · Session</text>
    <text x="407" y="280" text-anchor="middle" font-size="12.5" fill="#46584c">AdminAreaGuard</text>
    <text x="407" y="306" text-anchor="middle" font-size="12.5" fill="#46584c">Arquivos estáticos</text>
    <text x="407" y="332" text-anchor="middle" font-size="12.5" fill="#46584c">Routing</text>

    <rect x="516" y="110" width="160" height="140" rx="14" fill="#ffffff" stroke="#07562e" stroke-width="1.5"/>
    <text x="596" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#033c22">Controllers</text>
    <text x="596" y="174" text-anchor="middle" font-size="12.5" fill="#46584c">14 controllers</text>
    <text x="596" y="198" text-anchor="middle" font-size="12.5" fill="#46584c">lê · checa permissão</text>
    <text x="596" y="222" text-anchor="middle" font-size="12.5" fill="#46584c">chama · responde</text>

    <rect x="700" y="110" width="166" height="140" rx="14" fill="#ef8f22"/>
    <text x="783" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#2a1a05">Services</text>
    <text x="783" y="174" text-anchor="middle" font-size="12.5" fill="#2a1a05">45 arquivos</text>
    <text x="783" y="198" text-anchor="middle" font-size="12.5" fill="#2a1a05">regra de negócio</text>
    <text x="783" y="222" text-anchor="middle" font-size="12.5" fill="#2a1a05">DbContext direto</text>

    <rect x="516" y="288" width="160" height="140" rx="14" fill="#ffffff" stroke="#cdd9c7"/>
    <text x="596" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#033c22">Workers</text>
    <text x="596" y="352" text-anchor="middle" font-size="12.5" fill="#46584c">mensalidade do seguro</text>
    <text x="596" y="376" text-anchor="middle" font-size="12.5" fill="#46584c">lembrete da véspera</text>
    <text x="596" y="400" text-anchor="middle" font-size="12.5" fill="#46584c">retenção do log</text>

    <rect x="700" y="288" width="166" height="140" rx="14" fill="#ffffff" stroke="#cdd9c7"/>
    <text x="783" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#033c22">Hub SignalR</text>
    <text x="783" y="352" text-anchor="middle" font-size="12.5" fill="#46584c">/hubs/lanepets</text>
    <text x="783" y="376" text-anchor="middle" font-size="12.5" fill="#46584c">avisa o painel</text>
    <text x="783" y="400" text-anchor="middle" font-size="12.5" fill="#46584c">(reserva: 20 s)</text>

    <rect x="322" y="456" width="544" height="56" rx="14" fill="#033c22"/>
    <text x="594" y="490" text-anchor="middle" font-size="14" fill="#dcefb9"><tspan font-weight="700" fill="#fff">Envelope único</tspan>  { ok, data }  ·  erro { ok:false, error, codigo }  ·  ERR-4000 … ERR-5001</text>
  </g>

  <!-- dados -->
  <g class="t">
    <rect x="936" y="110" width="216" height="118" rx="14" fill="#ffffff" stroke="#07562e" stroke-width="1.5"/>
    <ellipse cx="978" cy="150" rx="22" ry="8" fill="#07562e"/><rect x="956" y="150" width="44" height="40" fill="#07562e"/><ellipse cx="978" cy="190" rx="22" ry="8" fill="#0a6b3a"/>
    <text x="1016" y="152" font-size="16" font-weight="700" fill="#033c22">SQLite</text>
    <text x="1016" y="174" font-size="12.5" fill="#46584c">lanepets.db · EF Core</text>
    <text x="1016" y="196" font-size="12.5" fill="#46584c">backup na subida</text>
    <rect x="936" y="252" width="216" height="80" rx="14" fill="#ffffff" stroke="#cdd9c7"/>
    <text x="1044" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#033c22">E-mail</text>
    <text x="1044" y="310" text-anchor="middle" font-size="12.5" fill="#46584c">SMTP ou arquivo .txt</text>
    <rect x="936" y="356" width="216" height="80" rx="14" fill="#ffffff" stroke="#cdd9c7"/>
    <text x="1044" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#033c22">Google</text>
    <text x="1044" y="414" text-anchor="middle" font-size="12.5" fill="#46584c">ID token + chaves JWKS</text>
    <rect x="936" y="456" width="216" height="56" rx="14" fill="#fdf0dd"/>
    <text x="1044" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4c07">Docker: /app/data</text>
    <text x="1044" y="500" text-anchor="middle" font-size="12" fill="#8a4c07">banco · backups · e-mails · logs</text>
  </g>

  <!-- setas -->
  <g fill="none" stroke="#07562e" stroke-width="2">
    <path d="M250 153H322" marker-end="url(#s)"/>
    <path d="M250 269H322" marker-end="url(#s)"/>
    <path d="M250 385H322" marker-end="url(#s)"/>
    <path d="M492 180H516" marker-end="url(#s)"/>
    <path d="M676 180H700" marker-end="url(#s)"/>
    <path d="M676 358C690 358 690 250 740 250" marker-end="url(#s)"/>
    <path d="M866 170H936" marker-end="url(#s)"/>
    <path d="M866 220C900 220 900 292 936 292" marker-end="url(#s)"/>
  </g>
  <g fill="none" stroke="#d97d12" stroke-width="2" stroke-dasharray="6 5">
    <path d="M783 250V288" marker-end="url(#l)"/>
    <path d="M783 428V438H205V432" marker-end="url(#l)"/>
    <path d="M250 300H290V446H906V396H934" marker-end="url(#l)"/>
  </g>
  <g class="t" font-size="11.5" font-weight="700" fill="#d97d12">
    <text x="150" y="452" text-anchor="middle">tempo real</text>
    <text x="1046" y="448" text-anchor="middle">ID token</text>
  </g>
</svg>
